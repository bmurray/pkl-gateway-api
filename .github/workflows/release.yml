name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: '0.27.1'

      - name: Extract release tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate Pkl modules
        run: make generate RELEASE_TAG=${{ steps.tag.outputs.tag }}

      - name: Resolve Pkl dependencies
        run: |
          cd generated-package
          pkl project resolve

      - name: Package Pkl project
        run: |
          cd generated-package
          pkl project package --output-path ../dist

      - name: List generated files
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
