name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: '0.27.1'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Strip 'v' prefix for package version
          PKG_VERSION=${VERSION#v}
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Update VERSION file
        run: echo "${{ steps.version.outputs.pkg_version }}" > VERSION

      - name: Generate Pkl modules
        run: make generate

      - name: Resolve Pkl dependencies
        run: |
          cd generated-package
          pkl project resolve

      - name: Package Pkl project
        run: |
          cd generated-package
          pkl project package --output-path ../dist

      - name: List generated files
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
